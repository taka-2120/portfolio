name: Sync Obsidian blog to portfolio

on:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:
    inputs:
      slug:
        description: 'Blog post slug to sync (empty = all)'
        required: false
        default: ''

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger obsidian-mcp-server /sync
        run: |
          SLUG="${{ inputs.slug }}"

          if [ -n "$SLUG" ] && ! echo "$SLUG" | grep -qE '^[a-z0-9]+(-[a-z0-9]+)*$'; then
            echo "Invalid slug: $SLUG"
            exit 1
          fi

          BASE_URL="${{ secrets.OBSIDIAN_MCP_URL }}"
          if [ -n "$SLUG" ]; then
            URL="${BASE_URL}/sync?slug=${SLUG}"
          else
            URL="${BASE_URL}/sync"
          fi

          response=$(curl -s -w "\n%{http_code}" -X POST \
            -H "Authorization: Bearer ${{ secrets.OBSIDIAN_MCP_TOKEN }}" \
            --max-time 120 \
            "$URL")

          body=$(echo "$response" | head -n -1)
          status=$(echo "$response" | tail -n 1)

          echo "Status: $status"
          echo "Response: $body"

          if [ "$status" != "200" ]; then
            echo "Sync failed"
            exit 1
          fi
